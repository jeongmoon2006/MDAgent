# Milestone 4 done-criterion benchmark: enhanced-sampling judgment on CLN025.
#
# Unlike trpcage_convergence.yaml (a convergence-of-observable task that vanilla
# MD can answer), this task is designed to be *unreachable* by vanilla MD within
# the budget. It is the forcing function for the M4 criterion: the scientist must
# detect that inadequacy itself, pivot to metadynamics, and the biased run must
# actually cross the barrier.
#
# `task_expectation` below is the string threaded into every scientist.decide()
# call. It is the only input gating `switch_to_metad`, and it is locked into the
# campaign config, so it must be passed identically on every resume.

name: cln025_folding
description: |
  Chignolin variant CLN025 (PDB 5AWL, sequence YYDPETGTWY) in TIP3P water at
  300 K. Sample the folding/unfolding transition of the beta-hairpin and
  recover the free-energy surface along the slow coordinate. The folding time
  is ~0.6-1.0 us; the compute budget is 20 ns of biased simulation, so vanilla
  MD is short of the transition by roughly two orders of magnitude and the
  campaign must pivot to enhanced sampling to succeed.

system:
  starting_pdb: "5AWL"        # downloaded via PDBFixer; 10 residues, ~5380 atoms solvated
  forcefield: ["amber14-all.xml", "amber14/tip3p.xml"]
  water_model: tip3p
  padding_nm: 1.0
  ionic_strength_M: 0.15
  starting_state: folded      # 5AWL is the native beta-hairpin

integrator:
  type: LangevinMiddle
  temperature_K: 300.0
  friction_per_ps: 1.0
  timestep_fs: 2.0
  constraints: HBonds

observable:
  name: rmsd_ca_to_reference_angstrom
  selection: "protein and name CA"
  reference: campaign_topology   # post-equilibration structure, constant across rounds

# Free-form campaign-level expectation passed to run_campaign(task_expectation=...).
# Written for the scientist, not for humans: it must state what has to be
# accomplished, the characteristic timescale, and the budget, because those are
# what the switch_to_metad rule compares against.
task_expectation: |
  Target: chignolin variant CLN025 (PDB 5AWL), a 10-residue beta-hairpin, in
  TIP3P water at 300 K. The simulation starts from the folded native structure.

  Objective: sample the folding/unfolding transition in both directions and
  recover the free-energy surface along the slow coordinate.

  Required transition: the campaign must connect the extended state (CA-RMSD to
  the native structure > 4.0 A) and the native beta-hairpin state (CA-RMSD <
  1.5 A), and must then cross back. A full A -> B -> A recrossing is required,
  not a single one-way event: a one-way crossing leaves the reverse barrier
  unsampled and the free-energy surface under-filled on one side.

  Characteristic timescale: the CLN025 folding time is 0.6-1.0 microseconds.

  Compute budget: 20 ns for the biased phase. Vanilla MD is therefore short of
  the folding time by roughly two orders of magnitude. Unbiased runs under
  50 ns are expected to stay trapped in whichever basin they start from, which
  here is the folded state.

# Done criterion (per ROADMAP.md, Milestone 4). All three must hold:
#   (a) the scientist decides `switch_to_metad` from the vanilla phase rather
#       than extending indefinitely;
#   (b) the CV it proposes is a defensible folding coordinate for a hairpin;
#   (c) the biased run crosses the barrier and comes back — at least one full
#       A -> B -> A recrossing, i.e. count_recrossings >= 2.
#
# Note on (c): `metad_report.recrossings` counts transitions on the *biased CV*,
# whichever one the scientist proposed. The CA-RMSD thresholds above are the
# scientific check on whether that CV crossing corresponds to real folding, and
# are verified post-hoc against the biased trajectory — not fed back into the
# loop. Pre-selecting an RMSD CV would decide the science the agent exists to
# decide.
done_criterion:
  pivot_required: true
  min_recrossings: 2                 # A -> B -> A, per count_recrossings semantics
  extended_state_rmsd_angstrom: 4.0  # A basin
  folded_state_rmsd_angstrom: 1.5    # B basin
  max_biased_ns: 20.0
