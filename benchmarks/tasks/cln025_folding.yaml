# Milestone 4 done-criterion benchmark: enhanced-sampling judgment on CLN025.
#
# Unlike trpcage_convergence.yaml (a convergence-of-observable task that vanilla
# MD can answer), this task is designed to be *unreachable* by vanilla MD within
# the budget. It is the forcing function for the M4 criterion: the scientist must
# detect that inadequacy itself, pivot to metadynamics, and the biased run must
# actually cross the barrier.
#
# The `task_expectation` string threaded into every scientist.decide() call is
# rendered from `expectation:` + `done_criterion:` by mdpilot.task_file, not
# authored here. It is the only input gating `switch_to_metad` and is locked
# into the campaign config, so it must render identically on every resume —
# which it does, because it is a function of these fields.

name: cln025_folding
description: |
  Chignolin variant CLN025 (PDB 5AWL, sequence YYDPETGTWY) in TIP3P water at
  300 K. Sample the folding/unfolding transition of the beta-hairpin and
  recover the free-energy surface along the slow coordinate. The folding time
  is ~0.6-1.0 us; the compute budget is 20 ns of biased simulation, so vanilla
  MD is short of the transition by roughly two orders of magnitude and the
  campaign must pivot to enhanced sampling to succeed.

system:
  starting_pdb: "5AWL"        # downloaded via PDBFixer; 10 residues, ~5380 atoms solvated
  forcefield: ["amber14-all.xml", "amber14/tip3p.xml"]
  water_model: tip3p
  padding_nm: 1.0
  ionic_strength_M: 0.15
  starting_state: folded      # 5AWL is the native beta-hairpin

integrator:
  type: LangevinMiddle
  temperature_K: 300.0
  friction_per_ps: 1.0
  timestep_fs: 2.0
  constraints: HBonds

observable:
  name: rmsd_ca_to_reference_angstrom
  selection: "protein and name CA"
  reference: campaign_topology   # post-equilibration structure, constant across rounds

# Campaign expectation. `task_expectation` — the string threaded into every
# scientist.decide() call, and the only input gating `switch_to_metad` — is
# RENDERED from these fields plus done_criterion below, not authored. It used to
# be free prose that restated the thresholds, the round-trip requirement and the
# budget in words; three of those four numbers existed twice, with nothing
# linking the copies. Only `objective` and the timescale are genuinely free.
expectation:
  objective: |
    Sample the folding/unfolding transition in both directions and recover the
    free-energy surface along the slow coordinate.
  # The one decision-driving number that exists nowhere else, so it carries a
  # citation. The scientist compares cumulative simulation time against it to
  # judge whether the budget can reach the transition.
  characteristic_timescale_ns: 800.0
  timescale_source: "CLN025 folding time 0.6-1.0 us; Lindorff-Larsen et al. 2011, Science 334:517"

# Enhanced-sampling bounds. The position is a task-level fact (what counts as
# unfolded), not something the scientist or a magic constant should decide; the
# wall stiffness lives in bias_designer with SIGMA and HEIGHT.
sampling:
  # 2x the extended-state threshold (0.4 nm). RMSD-to-native is unbounded on the
  # unfolded side, so without a wall well-tempered metaD drives the walker ever
  # further out instead of returning: the first campaign deposited 129 kJ/mol of
  # bias -- an order of magnitude past the real folding free energy -- and got
  # one crossing with no return trip.
  cv_upper_wall_nm: 0.8

# Done criterion (per ROADMAP.md, Milestone 4). All three must hold:
#   (a) the scientist decides `switch_to_metad` from the vanilla phase rather
#       than extending indefinitely;
#   (b) the CV it proposes is a defensible folding coordinate for a hairpin;
#   (c) the biased run crosses the barrier and comes back — at least one full
#       A -> B -> A recrossing, i.e. count_recrossings >= 2.
#
# Note on (c): `metad_report.recrossings` counts transitions on the *biased CV*,
# whichever one the scientist proposed. The CA-RMSD thresholds above are the
# scientific check on whether that CV crossing corresponds to real folding, and
# are verified post-hoc against the biased trajectory — not fed back into the
# loop. Pre-selecting an RMSD CV would decide the science the agent exists to
# decide.
done_criterion:
  pivot_required: true
  # The two states, named, on the campaign observable. `low`/`high` are
  # positions on that coordinate, not folding-specific roles — a ligand-binding
  # campaign names them "bound"/"unbound" on a distance and the mechanics are
  # unchanged. `count_recrossings` counts transitions between the two bands.
  states:
    low:  { name: "native beta-hairpin", threshold: 1.5 }
    high: { name: "extended",            threshold: 4.0 }
  min_recrossings: 2                 # 2 = a full A -> B -> A round trip
  max_biased_ns: 20.0
