[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdpilot"
version = "0.0.1"
description = "Closed-loop scientific reasoning agent for molecular dynamics"
readme = "docs/architecture.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jeongmoon Choi" }]
dependencies = [
  "openmm>=8.1",
  "mdtraj>=1.10",
  "numpy>=1.26",
  "scipy>=1.13",
  "anthropic>=0.40",
  "pyyaml>=6.0",
  "pdbfixer>=1.10",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
# The Streamlit control surface (`app.py`). An extra rather than a dependency:
# the loop, the scientist and the benchmarks all run headless, and nothing in
# `src/mdpilot/` imports any of these.
ui = [
  "streamlit>=1.30",
  "py3Dmol>=2.0",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

# The scientist's prompt is assembled at runtime from `mdpilot/knowledge/*.md`.
# Without this a wheel installs the code and none of the prose, and every
# decide() call fails on the first chunk read.
[tool.setuptools.package-data]
mdpilot = ["knowledge/*.md"]

# Correctness rules only, matching `.github/workflows/ci.yml` so a local run
# and CI cannot disagree. Style and line length are deliberately not enforced:
# this codebase carries long explanatory comments on purpose, and reformatting
# to satisfy a linter is the churn CLAUDE.md's "surgical changes" rule exists
# to prevent. Enabling E/W here would report ~80 line-length violations and
# nothing that is actually wrong.
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9", "B"]
